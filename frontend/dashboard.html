<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NexAPI — My Dashboard</title>
<meta name="description" content="Look up your NexAPI keys, check usage and expiry, and copy ready-made code samples.">
<meta name="theme-color" content="#04060D">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.ab1{width:50vw;height:50vw;background:radial-gradient(circle,rgba(99,102,241,.1) 0%,transparent 70%);top:-15vw;left:-10vw}
.ab2{width:40vw;height:40vw;background:radial-gradient(circle,rgba(139,92,246,.08) 0%,transparent 70%);bottom:-10vw;right:0;animation-direction:alternate-reverse}

nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(4,6,13,.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--b1)}
.nav-r{display:flex;gap:16px;align-items:center}
.nav-r a{color:var(--dim);font-size:.875rem;text-decoration:none;transition:color .2s}
.nav-r a:hover{color:var(--txt)}
.page{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:100px 24px 60px}

/* Lookup */
.lookup{background:var(--card);border:1px solid var(--b2);border-radius:22px;padding:40px;margin-bottom:28px;animation:rise .6s ease both}
.lk-h{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.lk-s{color:var(--dim);font-size:.875rem;margin-bottom:24px}
.lk-row{display:flex;gap:12px}
.lk-in{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--b1);border-radius:10px;padding:13px 16px;color:var(--txt);font-size:.92rem;outline:none;transition:border-color .25s}
.lk-in:focus{border-color:var(--indigo)}
.lk-in.invalid{border-color:var(--red)}
.lk-btn{background:var(--grad);color:#fff;border:none;padding:13px 28px;border-radius:10px;font-size:.875rem;font-weight:700;transition:all .3s;white-space:nowrap;display:flex;align-items:center;gap:8px;justify-content:center;min-width:120px}
.lk-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--glow-i)}
.lk-btn:disabled{opacity:.5;transform:none}
.err{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:12px 16px;color:var(--red);font-size:.85rem;margin-top:14px;display:none}
.err.show{display:block}

/* Summary strip */
.summary{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.summary.show{display:grid}
.sm-box{background:var(--card);border:1px solid var(--b1);border-radius:14px;padding:16px 18px}
.sm-l{font-size:.63rem;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.6px;margin-bottom:7px}
.sm-v{font-size:1.4rem;font-weight:800;letter-spacing:-.5px}

/* Key card */
.key-card{border-radius:22px;padding:2px;margin-bottom:18px;animation:rise .5s ease both;position:relative;background:var(--plan-grad,var(--b1))}
.kc-inner{background:var(--card);border-radius:20px;padding:30px;position:relative;z-index:1}
.kc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.kc-plan-lbl{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:2px;margin-bottom:5px}
.kc-name{font-size:1.1rem;font-weight:700}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:.72rem;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.s-active{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.s-expired{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.s-lifetime{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--gold)}
.s-limit{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--gold)}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pdot 2s infinite}
@keyframes pdot{0%,100%{opacity:1}50%{opacity:.3}}

/* Sub-key display */
.subkey-box{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.sk-lbl{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--indigo);letter-spacing:2.5px;margin-bottom:10px}
.sk-val{font-family:'JetBrains Mono',monospace;font-size:.92rem;word-break:break-all;letter-spacing:.5px;margin-bottom:12px;user-select:all}
.sk-acts{display:flex;gap:9px;flex-wrap:wrap}
.sk-btn{flex:1;min-width:110px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);color:var(--indigo);border-radius:8px;padding:9px 12px;font-size:.78rem;font-weight:600;transition:all .3s;text-align:center}
.sk-btn:hover{background:rgba(99,102,241,.2);transform:translateY(-1px)}

/* Stats grid */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.sg-box{background:rgba(255,255,255,.03);border:1px solid var(--b1);border-radius:12px;padding:14px 16px}
.sg-l{font-size:.65rem;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1.5px;margin-bottom:7px}
.sg-v{font-size:1.3rem;font-weight:800;letter-spacing:-.5px}

/* Usage ring */
.usage-section{display:flex;align-items:center;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.ring-wrap{flex-shrink:0;position:relative;width:80px;height:80px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:6}
.ring-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;font-family:'JetBrains Mono',monospace}
.usage-info{flex:1;min-width:180px}
.ui-title{font-size:.85rem;font-weight:600;margin-bottom:6px}
.ui-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.ui-fill{height:100%;border-radius:3px;transition:width 1.2s ease}
.ui-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace}

/* Countdown */
.cd{display:flex;gap:8px;margin-bottom:4px}
.cd-unit{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--b1);border-radius:12px;padding:12px 8px;text-align:center}
.cd-n{font-size:1.4rem;font-weight:800;font-family:'JetBrains Mono',monospace;letter-spacing:-1px}
.cd-l{font-size:.6rem;color:var(--muted);margin-top:3px;letter-spacing:2px}

/* Docs */
.docs{background:var(--card);border:1px solid var(--b1);border-radius:22px;padding:28px;animation:rise .6s ease .1s both;display:none}
.docs.show{display:block}
.docs-h{font-size:1rem;font-weight:700;margin-bottom:4px}
.docs-s{font-size:.8rem;color:var(--muted);margin-bottom:16px}
.tab-bar{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--b1);color:var(--muted);padding:7px 16px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.75rem;transition:all .25s}
.tab[aria-selected="true"]{background:rgba(99,102,241,.12);border-color:var(--b2);color:var(--indigo)}
.code{background:#03040a;border:1px solid var(--b1);border-radius:12px;padding:20px;padding-right:88px;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.85;overflow-x:auto;position:relative;white-space:pre;margin:0}
.cc{position:absolute;top:12px;right:12px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);color:var(--dim);border-radius:6px;padding:5px 11px;font-size:.7rem;transition:all .25s}
.cc:hover{color:var(--indigo)}
.c1{color:#22D3EE}.c2{color:#86EFAC}.c3{color:#FDE68A}.c4{color:#F472B6}.cm{color:#475569}

/* Empty */
.empty{text-align:center;padding:48px 24px;color:var(--muted);background:var(--card);border:1px solid var(--b1);border-radius:22px;animation:rise .5s ease both}
.empty-cta{margin-top:20px;background:var(--grad);color:#fff;border:none;padding:11px 26px;border-radius:8px;font-size:.875rem;font-weight:600}

@media(max-width:580px){
  nav{padding:14px 20px}
  .page{padding:92px 16px 44px}
  .lookup{padding:28px 22px}
  .lk-row{flex-direction:column}
  .kc-inner{padding:22px 18px}
  .sg{grid-template-columns:1fr}
  .cd-n{font-size:1.1rem}
  .code{padding:16px;padding-top:46px;font-size:.72rem}
  .cc{top:10px;left:12px;right:auto}
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div class="aurora" aria-hidden="true"><div class="ab ab1"></div><div class="ab ab2"></div></div>

<nav>
  <a href="index.html" class="logo" aria-label="NexAPI home"><div class="logo-mark" aria-hidden="true">N</div><span class="logo-text">NexAPI</span></a>
  <div class="nav-r">
    <a href="docs.html">Docs</a>
    <a href="index.html">← Buy Plan</a>
  </div>
</nav>

<div class="page" id="main">
  <section class="lookup">
    <h1 class="lk-h">My API Keys</h1>
    <p class="lk-s">Enter the email you used at checkout to retrieve your keys.</p>
    <div class="lk-row">
      <label for="em-in" class="sr-only">Email address</label>
      <input type="email" id="em-in" class="lk-in" placeholder="you@example.com" autocomplete="email" inputmode="email">
      <button class="lk-btn" id="lk-btn"><span id="lk-txt">Look Up</span></button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </section>

  <div class="summary" id="summary"></div>
  <div id="results"></div>

  <section class="docs" id="docs">
    <h2 class="docs-h">How to Use Your Key</h2>
    <p class="docs-s">Samples are filled in with your active key and gateway URL — copy and run.</p>
    <div class="tab-bar" role="tablist">
      <button class="tab" role="tab" data-tab="curl"   aria-selected="true">cURL</button>
      <button class="tab" role="tab" data-tab="python" aria-selected="false">Python</button>
      <button class="tab" role="tab" data-tab="js"     aria-selected="false">JavaScript</button>
      <button class="tab" role="tab" data-tab="php"    aria-selected="false">PHP</button>
    </div>
    <div style="position:relative">
      <pre class="code" id="code-out"></pre>
      <button class="cc" id="code-copy">Copy</button>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script>
const { BACKEND, ORIGIN, esc, copyBtn, toast, api, fmtNum, fmtDate } = window.NEXAPI;

const emailIn = document.getElementById('em-in');
const errBox  = document.getElementById('err');
const results = document.getElementById('results');
const summary = document.getElementById('summary');

// Countdown timers are tracked so a second lookup doesn't leave the previous
// render's intervals running against DOM nodes that no longer exist.
let timers = [];
const clearTimers = () => { timers.forEach(clearInterval); timers = []; };

// Prefill from ?email=, then from whatever was used to buy on this device
const paramEmail = new URLSearchParams(location.search).get('email');
const saved      = paramEmail || localStorage.getItem('nexapi_email');
if (saved) { emailIn.value = saved; setTimeout(lookup, 400); }

document.getElementById('lk-btn').addEventListener('click', lookup);
emailIn.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });

async function lookup() {
  const email = emailIn.value.trim().toLowerCase();
  errBox.classList.remove('show');
  emailIn.classList.remove('invalid');

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errBox.textContent = 'Please enter a valid email address.';
    errBox.classList.add('show');
    emailIn.classList.add('invalid');
    return;
  }

  const btn = document.getElementById('lk-btn'), txt = document.getElementById('lk-txt');
  btn.disabled = true;
  txt.innerHTML = '<span class="spin"></span>';

  try {
    const d = await api(`/api/key/${encodeURIComponent(email)}`);
    if (!d.success) throw new Error(d.error || 'Lookup failed');
    localStorage.setItem('nexapi_email', email);
    renderKeys(d.keys, email);
  } catch (e) {
    errBox.textContent = '⚠ ' + e.message;
    errBox.classList.add('show');
    clearTimers();
    results.innerHTML = '';
    summary.classList.remove('show');
    document.getElementById('docs').classList.remove('show');
  } finally {
    btn.disabled = false;
    txt.textContent = 'Look Up';
  }
}

function renderKeys(keys, email) {
  clearTimers();

  if (!keys?.length) {
    summary.classList.remove('show');
    document.getElementById('docs').classList.remove('show');
    results.innerHTML = `
      <div class="empty">
        <p style="font-size:1.6rem;margin-bottom:12px">🔍</p>
        <p>No keys found for <strong>${esc(email)}</strong></p>
        <p style="font-size:.82rem;margin-top:8px">If you just paid, give the webhook a few seconds and try again.</p>
        <button class="empty-cta" onclick="location.href='index.html'">Buy a Plan →</button>
      </div>`;
    return;
  }

  const live = keys.filter(k => k.is_active && !k.is_expired);
  const totalUsed = keys.reduce((s, k) => s + (k.requests_used || 0), 0);
  const totalLeft = keys.reduce((s, k) => k.requests_limit == null ? s : s + Math.max(0, k.requests_limit - k.requests_used), 0);
  const anyUnlimited = keys.some(k => k.is_active && !k.is_expired && k.requests_limit == null);

  summary.innerHTML = `
    <div class="sm-box"><div class="sm-l">ACTIVE KEYS</div><div class="sm-v" style="color:var(--green)">${live.length}</div></div>
    <div class="sm-box"><div class="sm-l">TOTAL KEYS</div><div class="sm-v">${keys.length}</div></div>
    <div class="sm-box"><div class="sm-l">REQUESTS USED</div><div class="sm-v">${fmtNum(totalUsed)}</div></div>
    <div class="sm-box"><div class="sm-l">REMAINING</div><div class="sm-v" style="color:var(--cyan)">${anyUnlimited ? '∞' : fmtNum(totalLeft)}</div></div>`;
  summary.classList.add('show');

  // Newest active key first — that is the one people actually want to copy
  const ordered = [...keys].sort((a, b) => (b.is_active && !b.is_expired) - (a.is_active && !a.is_expired));
  results.innerHTML = ordered.map((k, i) => buildCard(k, i)).join('');

  results.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ok = await copyBtn(btn.dataset.copy, btn);
      if (ok) toast('Copied to clipboard', 'ok');
    });
  });

  ordered.forEach((k, i) => {
    if (k.is_active && !k.is_expired && !k.is_lifetime && k.expires_at) startCountdown(k.expires_at, i);
  });

  activeKey = ordered.find(k => k.is_active && !k.is_expired) || ordered[0];
  document.getElementById('docs').classList.add('show');
  renderCode();
}

function buildCard(k, i) {
  const limited  = k.requests_limit != null;
  const used     = k.requests_used || 0;
  const pct      = limited ? Math.min(100, (used / k.requests_limit) * 100) : 0;
  const limitHit = limited && used >= k.requests_limit;
  const active   = k.is_active && !k.is_expired && !limitHit;
  const color    = k.plan_color || '#6366F1';
  const fill     = pct > 90 ? '#EF4444' : pct > 70 ? '#F59E0B' : color;
  const left     = limited ? Math.max(0, k.requests_limit - used) : null;
  const expFmt   = k.is_lifetime ? 'Never (Lifetime ♾️)' : fmtDate(k.expires_at);
  const r = 36, circ = 2 * Math.PI * r, offset = circ * (1 - pct / 100);

  // Expiry outranks the quota: a key that ran out *and* expired reads "EXPIRED",
  // because buying a new plan is the fix either way.
  const status =
    k.is_expired  ? { cls: 's-expired',  txt: 'EXPIRED' } :
    !k.is_active  ? { cls: 's-expired',  txt: 'DISABLED' } :
    limitHit      ? { cls: 's-limit',    txt: 'LIMIT REACHED' } :
    k.is_lifetime ? { cls: 's-lifetime', txt: 'LIFETIME' } :
                    { cls: 's-active',   txt: 'ACTIVE' };

  const sampleUrl = `${ORIGIN}/admin/paid/key?key=${k.sub_key}&num=`;

  return `
  <article class="key-card" style="--plan-grad:linear-gradient(135deg,${color},${color}55);animation-delay:${i * .08}s">
    <div class="kc-inner">
      <div class="kc-top">
        <div>
          <div class="kc-plan-lbl" style="color:${color}">${esc((k.plan_name || 'PLAN').toUpperCase())} ACCESS</div>
          <h2 class="kc-name">API Key #${i + 1}</h2>
        </div>
        <div class="status-pill ${status.cls}"><span class="pill-dot" aria-hidden="true"></span>${status.txt}</div>
      </div>

      <div class="subkey-box">
        <div class="sk-lbl">SUB-API KEY</div>
        <div class="sk-val">${esc(k.sub_key)}</div>
        <div class="sk-acts">
          <button class="sk-btn" data-copy="${esc(k.sub_key)}">📋 Copy Key</button>
          <button class="sk-btn" data-copy="${esc(sampleUrl)}">🔗 Copy URL</button>
        </div>
      </div>

      <div class="sg">
        <div class="sg-box"><div class="sg-l">USED</div><div class="sg-v" style="color:${color}">${fmtNum(used)}</div></div>
        <div class="sg-box"><div class="sg-l">REMAINING</div><div class="sg-v" style="color:${active ? 'var(--green)' : 'var(--muted)'}">${left !== null ? fmtNum(left) : '∞'}</div></div>
        <div class="sg-box"><div class="sg-l">EXPIRES</div><div class="sg-v" style="font-size:.85rem;font-weight:600">${expFmt}</div></div>
      </div>

      ${limited ? `
      <div class="usage-section">
        <div class="ring-wrap">
          <svg width="80" height="80" role="img" aria-label="${Math.round(pct)} percent of requests used">
            <circle class="ring-bg" cx="40" cy="40" r="${r}"/>
            <circle class="ring-fill" cx="40" cy="40" r="${r}" stroke="${fill}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
          </svg>
          <div class="ring-txt" style="color:${fill}">${Math.round(pct)}%</div>
        </div>
        <div class="usage-info">
          <div class="ui-title">API Usage</div>
          <div class="ui-bar"><div class="ui-fill" style="width:${pct}%;background:${fill}"></div></div>
          <div class="ui-labels"><span>${fmtNum(used)} used</span><span>${fmtNum(k.requests_limit)} total</span></div>
        </div>
      </div>` : ''}

      ${active && !k.is_lifetime ? `
      <div class="cd" id="cd-${i}">
        <div class="cd-unit"><div class="cd-n" id="cd-d-${i}" style="color:${color}">--</div><div class="cd-l">DAYS</div></div>
        <div class="cd-unit"><div class="cd-n" id="cd-h-${i}">--</div><div class="cd-l">HRS</div></div>
        <div class="cd-unit"><div class="cd-n" id="cd-m-${i}">--</div><div class="cd-l">MIN</div></div>
        <div class="cd-unit"><div class="cd-n" id="cd-s-${i}">--</div><div class="cd-l">SEC</div></div>
      </div>` : ''}
    </div>
  </article>`;
}

function startCountdown(expiresAt, i) {
  const pad = n => String(Math.max(0, Math.floor(n))).padStart(2, '0');
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = pad(v); };

  const tick = () => {
    const diff = new Date(expiresAt) - Date.now();
    if (diff <= 0) {
      ['d', 'h', 'm', 's'].forEach(u => set(`cd-${u}-${i}`, 0));
      return false;
    }
    set(`cd-d-${i}`, diff / 86400000);
    set(`cd-h-${i}`, (diff % 86400000) / 3600000);
    set(`cd-m-${i}`, (diff % 3600000) / 60000);
    set(`cd-s-${i}`, (diff % 60000) / 1000);
    return true;
  };

  tick();
  const id = setInterval(() => { if (!tick()) clearInterval(id); }, 1000);
  timers.push(id);
}

// ── Code samples ──────────────────────────────────────────────
// Built in JS so the gateway URL and key are always the real ones — no more
// hand-editing four HTML snippets after every redeploy.
let activeKey = null, activeTab = 'curl';

const sample = (tab, key) => ({
  curl: `<span class="cm"># Replace the number with your own input</span>\ncurl "<span class="c1">${esc(ORIGIN)}/admin/paid/key</span><span class="c3">?key=${esc(key)}&amp;num=919876543210</span>"`,
  python: `<span class="c4">import</span> requests\n\nres = requests.get(\n    <span class="c2">"${esc(ORIGIN)}/admin/paid/key"</span>,\n    params={<span class="c2">"key"</span>: <span class="c2">"${esc(key)}"</span>, <span class="c2">"num"</span>: <span class="c2">"919876543210"</span>}\n)\n<span class="c4">print</span>(res.json())`,
  js: `<span class="c4">const</span> res = <span class="c4">await</span> fetch(\n  <span class="c2">"${esc(ORIGIN)}/admin/paid/key?key=${esc(key)}&amp;num=919876543210"</span>\n);\n<span class="c4">const</span> data = <span class="c4">await</span> res.json();\nconsole.log(data);`,
  php: `<span class="c3">&lt;?php</span>\n<span class="c4">$url</span>  = <span class="c2">"${esc(ORIGIN)}/admin/paid/key"</span>\n      . <span class="c2">"?key=${esc(key)}&amp;num=919876543210"</span>;\n<span class="c4">$resp</span> = json_decode(file_get_contents(<span class="c4">$url</span>), <span class="c4">true</span>);\nvar_dump(<span class="c4">$resp</span>);`
}[tab]);

function renderCode() {
  const key = activeKey?.sub_key || 'YOUR_KEY';
  document.getElementById('code-out').innerHTML = sample(activeTab, key);
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
    renderCode();
  });
});

document.getElementById('code-copy').addEventListener('click', async e => {
  const text = document.getElementById('code-out').textContent;
  const ok = await copyBtn(text, e.currentTarget, '✓ Copied');
  if (ok) toast('Code copied', 'ok');
});

renderCode();
</script>
</body>
</html>
